name: Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: "Build APK #${{ github.run_number }}.${{ github.run_attempt }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out RDM and FreeRDP
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.13113456" \
            "cmake;4.1.2"

      - name: Build numbered debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare numbered artifact
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
          printf '%s.%s\n' "$BUILD_NUMBER" "$BUILD_ATTEMPT" > artifacts/BUILD_NUMBER.txt
          {
            echo "### RDM APK build #${BUILD_NUMBER}.${BUILD_ATTEMPT}"
            echo "APK: RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
            echo "Android versionCode: $((BUILD_NUMBER * 1000 + BUILD_ATTEMPT))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rdm-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
