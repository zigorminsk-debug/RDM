name: Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: "Build APK #${{ github.run_number }}.${{ github.run_attempt }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      release_enabled: ${{ steps.release_signing.outputs.enabled }}

    steps:
      - name: Check out RDM and FreeRDP
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare FreeRDP Android Gradle configuration
        run: ./scripts/prepare-freerdp-android.sh

      - name: Install NASM for the OpenH264 x86_64 build
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
          nasm -v

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK root: ${ANDROID_SDK_ROOT:-${ANDROID_HOME:-unset}}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error title=Android SDK setup::sdkmanager was not added to PATH"
            printf 'cmdline-tools files:\n'
            find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version
          packages=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;36.0.0"
            "ndk;29.0.13113456"
            "cmake;4.1.2"
          )
          for package in "${packages[@]}"; do
            echo "Installing Android SDK package: ${package}"
            log_file="$RUNNER_TEMP/sdkmanager-install.log"
            if sdkmanager "${package}" >"${log_file}" 2>&1; then
              tail -n 4 "${log_file}"
            else
              cat "${log_file}"
              detail="$(tail -c 1500 "${log_file}" | tr '\r\n' ' ' | tr -s ' ' | tail -c 500)"
              echo "::error title=Android SDK package install failed::${package} — ${detail}"
              exit 1
            fi
          done

      - name: Build numbered debug APK
        id: gradle_build
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/gradle-build.log"
          ./gradlew --no-daemon --stacktrace --console=plain --no-parallel --max-workers=1 assembleDebug >"${log_file}" 2>&1
          tail -n 80 "${log_file}"

      - name: Report Gradle APK build failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/gradle-build.log"
          if [[ -f "${log_file}" ]]; then
            tail -n 120 "${log_file}"
            detail="$(python3 - "${log_file}" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(errors="replace")
          lines = text.splitlines()
          failure_pattern = re.compile(
              r"(^FAILED:|^ninja: error:|^CMake Error|fatal error:|\berror:|make\[[0-9]+\]: \*\*\*|^make: \*\*\*|^gmake(?:\[[0-9]+\])?: \*\*\*|curl: \(|HTTP error [45][0-9]{2}|Could not resolve host|Failed to download|Connection timed out|Permission denied)",
              re.I,
          )
          matches = [i for i, line in enumerate(lines) if failure_pattern.search(line)]
          failure_context = []
          for i in matches[-20:]:
              failure_context.extend(lines[i:min(len(lines), i + 5)])
          start = text.find("* What went wrong:")
          if start >= 0:
              end = text.find("* Try:", start)
              section = text[start:end if end >= 0 else None]
              header = section.splitlines()[0] if section.splitlines() else "* What went wrong:"
              detail = header + "\nRelevant failure output:\n" + "\n".join(failure_context[-40:]) if failure_context else section[:600] + "\n[...truncated...]\n" + section[-1750:]
          else:
              detail = "\n".join(failure_context[-40:]) if failure_context else text[-2400:]
          if len(detail) > 2400:
              detail = detail[:500] + "\n[...truncated...]\n" + detail[-1850:]
          sys.stdout.write(detail)
          PY
          )"
          else
            detail="Gradle build failed without producing a log file."
          fi
          detail="$(printf '%s' "${detail}" | tr '\r\n' ' ' | tr -s ' ')"
          {
            echo '## Gradle APK build failed'
            echo
            echo '```text'
            printf '%s\n' "${detail}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Gradle APK build failed::${detail}"

      - name: Prepare numbered artifact
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
          printf '%s.%s\n' "$BUILD_NUMBER" "$BUILD_ATTEMPT" > artifacts/BUILD_NUMBER.txt
          {
            echo "### RDM APK build #${BUILD_NUMBER}.${BUILD_ATTEMPT}"
            echo "APK: RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
            echo "Android versionCode: $((BUILD_NUMBER * 1000 + BUILD_ATTEMPT))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rdm-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Configure permanent release signing
        id: release_signing
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          missing=0
          present=0
          for value in "${values[@]}"; do
            if [[ -z "$value" ]]; then missing=$((missing + 1)); else present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signed release skipped::Add the four permanent Android signing secrets to enable signed GitHub Releases."
            {
              echo '### Signed GitHub Release skipped'
              echo 'The numbered debug APK is available above. Configure all four Android signing secrets to publish an installable, signed release.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "::error title=Incomplete Android signing configuration::Set all four release-signing secrets or remove the partial configuration."
            exit 1
          fi
          key_path="$RUNNER_TEMP/rdm-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          if [[ ! -s "$key_path" ]]; then
            echo "::error title=Invalid Android keystore::The decoded release keystore is empty."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        id: gradle_release
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.enabled == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rdm-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/gradle-release-build.log"
          ./gradlew --no-daemon --stacktrace --console=plain --no-parallel --max-workers=1 assembleRelease >"${log_file}" 2>&1
          tail -n 80 "${log_file}"

      - name: Report Gradle release build failure
        if: failure() && steps.gradle_release.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/gradle-release-build.log"
          if [[ -f "${log_file}" ]]; then
            tail -n 120 "${log_file}"
            detail="$(tail -n 40 "${log_file}" | tr '\r\n' ' ' | tr -s ' ')"
          else
            detail="Gradle release build failed without producing a log file."
          fi
          {
            echo '## Signed release build failed'
            echo
            echo '```text'
            printf '%s\n' "$detail"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Gradle release APK build failed::${detail}"

      - name: Prepare signed release assets
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.enabled == 'true'
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_name="RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${apk_name}"
          sha256="$(sha256sum "release-assets/${apk_name}" | cut -d ' ' -f 1)"
          version_name="1.0.0+${BUILD_NUMBER}.${BUILD_ATTEMPT}"
          version_code=$((BUILD_NUMBER * 1000 + BUILD_ATTEMPT))
          python3 - "$apk_name" "$version_name" "$version_code" "$sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          apk_name, version_name, version_code, sha256 = sys.argv[1:]
          manifest = {
              "packageName": "com.rdm.android",
              "versionCode": int(version_code),
              "versionName": version_name,
              "apkAssetName": apk_name,
              "sha256": sha256,
          }
          Path("release-assets/rdm-update.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          {
            echo "### Signed release RDM ${version_name}"
            echo "APK: ${apk_name}"
            echo "SHA-256: ${sha256}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release artifact
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rdm-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish signed GitHub Release
    needs: build-apk
    if: github.ref == 'refs/heads/main' && needs.build-apk.outputs.release_enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@v7
        with:
          name: rdm-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-assets

      - name: Publish signed GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          version_name="1.0.0+${BUILD_NUMBER}.${BUILD_ATTEMPT}"
          release_tag="v${version_name}"
          apk_name="RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
          gh release create "$release_tag" \
            "release-assets/${apk_name}" \
            release-assets/rdm-update.json \
            --title "RDM ${version_name}" \
            --notes "Подписанная сборка RDM для Android. Установите APK через системный установщик." \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --latest
