name: Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: "Build APK #${{ github.run_number }}.${{ github.run_attempt }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out RDM and FreeRDP
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare FreeRDP Android Gradle configuration
        run: ./scripts/prepare-freerdp-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK root: ${ANDROID_SDK_ROOT:-${ANDROID_HOME:-unset}}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error title=Android SDK setup::sdkmanager was not added to PATH"
            printf 'cmdline-tools files:\n'
            find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version
          packages=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;36.0.0"
            "ndk;29.0.13113456"
            "cmake;4.1.2"
          )
          for package in "${packages[@]}"; do
            echo "Installing Android SDK package: ${package}"
            log_file="$RUNNER_TEMP/sdkmanager-install.log"
            if sdkmanager "${package}" >"${log_file}" 2>&1; then
              tail -n 4 "${log_file}"
            else
              cat "${log_file}"
              detail="$(tail -c 1500 "${log_file}" | tr '\r\n' ' ' | tr -s ' ' | tail -c 500)"
              echo "::error title=Android SDK package install failed::${package} — ${detail}"
              exit 1
            fi
          done

      - name: Build numbered debug APK
        id: gradle_build
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/gradle-build.log"
          ./gradlew --no-daemon --stacktrace --console=plain --no-parallel --max-workers=1 assembleDebug >"${log_file}" 2>&1
          tail -n 80 "${log_file}"

      - name: Report Gradle APK build failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/gradle-build.log"
          if [[ -f "${log_file}" ]]; then
            tail -n 120 "${log_file}"
            detail="$(python3 - "${log_file}" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(errors="replace")
          start = text.find("* What went wrong:")
          if start >= 0:
              end = text.find("* Try:", start)
              detail = text[start:end if end >= 0 else None]
          else:
              lines = text.splitlines()
              relevant = [line for line in lines if re.search(r"fatal error:|error:|FAILED:|BUILD FAILED|Caused by:", line, re.I)]
              detail = "\n".join(relevant[-50:]) if relevant else text[-2400:]
          sys.stdout.write(detail[:2400])
          PY
          )"
          else
            detail="Gradle build failed without producing a log file."
          fi
          detail="$(printf '%s' "${detail}" | tr '\r\n' ' ' | tr -s ' ')"
          {
            echo '## Gradle APK build failed'
            echo
            echo '```text'
            printf '%s\n' "${detail}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Gradle APK build failed::${detail}"

      - name: Prepare numbered artifact
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
          printf '%s.%s\n' "$BUILD_NUMBER" "$BUILD_ATTEMPT" > artifacts/BUILD_NUMBER.txt
          {
            echo "### RDM APK build #${BUILD_NUMBER}.${BUILD_ATTEMPT}"
            echo "APK: RDM-${BUILD_NUMBER}-${BUILD_ATTEMPT}.apk"
            echo "Android versionCode: $((BUILD_NUMBER * 1000 + BUILD_ATTEMPT))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rdm-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
