name: Build and Release RDM Android App

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  packages: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compute Build & Version Info
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$((1000 + RUN_NUM))
          VERSION_NAME="1.0.${RUN_NUM}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${RUN_NUM}" >> $GITHUB_ENV
          echo "Computed version: ${VERSION_NAME} (code: ${VERSION_CODE})"

      - name: Build Signed Release APK
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build_log.txt || {
            tail -n 300 build_log.txt > error_tail.txt
            gh issue create --title "Build Error Run ${{ github.run_number }}" --body-file error_tail.txt || true
            exit 1
          }

      - name: Organize Artifacts
        run: |
          mkdir -p release-output
          find app/build/outputs -name "*.apk" -exec cp {} release-output/ \;
          for f in release-output/*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "release-output/RDM-v${{ env.VERSION_NAME }}-signed.apk"
              break
            fi
          done
          ls -la release-output/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDM-v${{ env.VERSION_NAME }}-Release-APK
          path: release-output/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.VERSION_NAME }}"
          TITLE="RDM Release v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          
          gh release create "$TAG" release-output/*.apk \
            --title "$TITLE" \
            --notes "### 🚀 Remote Desktop Manager (RDM) Android v${{ env.VERSION_NAME }}
          
          **Номер сборки**: \`${{ env.VERSION_CODE }}\`
          
          #### 📦 Что включено:
          - 🔑 **Постоянный ключ подписи (Release Keystore)**: обновление поверх без удаления приложения.
          - 🏢 **Иерархия клиентов и серверов**: список клиентов -> карточки серверов при клике.
          - ⚡ **RDP запуск**: клик на карточку запускает RDP подключение (MS Remote Desktop, aFreeRDP, .rdp файл).
          - ✏️ **Редактирование серверов**: долгое нажатие открывает модальное окно со всеми полями.
          - 💾 **Экспорт и импорт**: полное резервное копирование в JSON.
          - 🌐 **Проверка доступности**: встроенный TCP Ping.
          
          #### 📥 Скачать APK:
          - Скачайте \`RDM-v${{ env.VERSION_NAME }}-signed.apk\` ниже." || true
